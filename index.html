<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShiftCtrlHub — Minimalist Remote</title>
  <style>
    /* =========================================================================
       SHIFTCTRLHUB: ULTRA-MINIMALIST CONTROLLER
       - Palette: Pure Black (#000000), Deep Burgundy (#6D001A), Crisp White (#FFFFFF)
       - Top-Right Vertical Mode Switches (RC/LFR, 4v4/2WD, Buttons/Joy) with wide touch hitboxes
       - Slender, stylish sliders (Vertical Throttle + Horizontal 2WD Steering)
       - 2WD Mode:
         * Left: Vertical Throttle Slider (auto-centers to 0%) with "THROTTLE" heading
         * Right: Horizontal Steering Slider (auto-centers to 0%) with "STEERING" heading
         * Also supports Joystick in 2WD mode (via B_J_switch)!
       - 4WD Mode:
         * Left: Vertical Throttle Slider (0–255)
         * Right: 4-movement diamond buttons (or Joystick via B_J_switch)
       ========================================================================= */

    :root {
      /* Core ShiftCtrlHub Brand Identity */
      --c-black: #000000;
      --c-burgundy: #6D001A;
      --c-burgundy-glow: rgba(109, 0, 26, 0.45);
      --c-burgundy-subtle: rgba(109, 0, 26, 0.16);
      --c-white: #FFFFFF;

      /* Strategic Semantic Telemetry & Interface Accents */
      --c-emerald: #10B981;
      --c-emerald-glow: rgba(16, 185, 129, 0.35);
      --c-emerald-subtle: rgba(16, 185, 129, 0.12);

      --c-cyan: #06B6D4;
      --c-cyan-glow: rgba(6, 182, 212, 0.35);
      --c-cyan-subtle: rgba(6, 182, 212, 0.12);

      --c-azure: #3B82F6;
      --c-azure-glow: rgba(59, 130, 246, 0.35);
      --c-azure-subtle: rgba(59, 130, 246, 0.12);

      --c-amber: #F59E0B;
      --c-amber-glow: rgba(245, 158, 11, 0.35);
      --c-amber-subtle: rgba(245, 158, 11, 0.12);

      --c-amethyst: #8B5CF6;
      --c-amethyst-glow: rgba(139, 92, 246, 0.35);
      --c-amethyst-subtle: rgba(139, 92, 246, 0.12);

      --c-rose: #F43F5E;
      --c-rose-glow: rgba(244, 63, 94, 0.35);
      --c-rose-subtle: rgba(244, 63, 94, 0.12);

      --c-flame: #FF2D55;
      --c-flame-glow: rgba(255, 45, 85, 0.4);

      --bg-page: #040406;
      --bg-frame: #09090C;
      --bg-card: #111115;
      --bg-key: #16161B;
      --bg-key-hover: #1E1E26;
      --bg-pressed: #262632;
      
      --border-hairline: #16161C;
      --border-subtle: #22222B;
      --border-medium: #32323E;
      
      --text-main: #FFFFFF;
      --text-muted: #8E8E9E;
      --text-dim: #4B4B58;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.6);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.85);
      --shadow-key: 0 3px 0 #000000, 0 4px 10px rgba(0, 0, 0, 0.6);
      --shadow-key-pressed: 0 1px 0 #000000, inset 0 2px 5px rgba(0, 0, 0, 0.8);
      --shadow-rail: inset 0 2px 6px rgba(0, 0, 0, 0.9);

      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", "Cascadia Mono", ui-monospace, monospace;
    }

    body.theme-light {
      --c-emerald: #059669;
      --c-emerald-glow: rgba(5, 150, 105, 0.25);
      --c-emerald-subtle: rgba(5, 150, 105, 0.1);

      --c-cyan: #0891B2;
      --c-cyan-glow: rgba(8, 145, 178, 0.25);
      --c-cyan-subtle: rgba(8, 145, 178, 0.1);

      --c-azure: #2563EB;
      --c-azure-glow: rgba(37, 99, 235, 0.25);
      --c-azure-subtle: rgba(37, 99, 235, 0.1);

      --c-amber: #D97706;
      --c-amber-glow: rgba(217, 119, 6, 0.25);
      --c-amber-subtle: rgba(217, 119, 6, 0.1);

      --c-amethyst: #7C3AED;
      --c-amethyst-glow: rgba(124, 58, 237, 0.25);
      --c-amethyst-subtle: rgba(124, 58, 237, 0.1);

      --c-rose: #E11D48;
      --c-rose-glow: rgba(225, 29, 72, 0.25);
      --c-rose-subtle: rgba(225, 29, 72, 0.1);

      --c-flame: #E11D48;
      --c-flame-glow: rgba(225, 29, 72, 0.3);

      --bg-page: #EAEAEF;
      --bg-frame: #FFFFFF;
      --bg-card: #F5F5F9;
      --bg-key: #FFFFFF;
      --bg-key-hover: #F0F0F5;
      --bg-pressed: #E4E4EB;
      
      --border-hairline: #E8E8EE;
      --border-subtle: #D4D4DC;
      --border-medium: #B2B2C0;
      
      --text-main: #000000;
      --text-muted: #5A5A68;
      --text-dim: #9292A0;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-key: 0 3px 0 #D4D4DC, 0 4px 10px rgba(0, 0, 0, 0.05);
      --shadow-key-pressed: 0 1px 0 #D4D4DC, inset 0 2px 4px rgba(0, 0, 0, 0.08);
      --shadow-rail: inset 0 2px 5px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--c-burgundy);
      color: #FFFFFF;
    }

    /* Precision Craft Floor: Custom Aerospace Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-frame);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--c-burgundy);
    }

    body {
      background-color: var(--bg-page);
      background-image: radial-gradient(circle at 50% 30%, rgba(109, 0, 26, 0.08) 0%, transparent 65%);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .tnum {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .cockpit-canvas {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .cockpit-surface {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .cockpit-surface.active {
      display: block;
    }

    /* Device Chassis Frame */
    .device-chassis {
      width: 100%;
      max-width: 960px;
      height: 480px;
      background: var(--bg-frame);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .device-chassis.fullscreen {
      max-width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }

    /* Top Quick Utility Bar (For Desktop Testing) */
    .toolbar-quick {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .quick-btn {
      background: var(--bg-frame);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: var(--radius-xs);
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .quick-btn:hover {
      color: var(--text-main);
      border-color: var(--border-medium);
    }

    /* =========================================================================
       1. TOP APP BAR WITH VERTICALLY STACKED SWITCHES IN UPPER RIGHT
       ========================================================================= */
    .app-header {
      min-height: 82px;
      background: var(--bg-frame);
      border-bottom: 1px solid var(--border-hairline);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-mark {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c-emerald);
      box-shadow: 0 0 8px var(--c-emerald-glow);
      animation: liveTelemetryPulse 2.4s infinite ease-in-out;
    }
    @keyframes liveTelemetryPulse {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 6px var(--c-emerald-glow); }
      50% { transform: scale(1.28); opacity: 0.65; box-shadow: 0 0 12px var(--c-emerald-glow); }
    }

    /* Connection Pill & Settings */
    .header-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* CENTER RIBBON: 4 WAYS TO CONNECT (SoftAP, STA, BLE, SPP) */
    .header-center-connections {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .transport-bar {
      display: inline-flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      padding: 2px;
      gap: 2px;
      box-shadow: var(--shadow-sm);
    }

    .transport-tab {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.4px;
    }
    .transport-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }
    
    /* Dedicated Protocol Identity Accents */
    .transport-tab.active {
      color: var(--c-white);
    }
    #tabSoftap.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 1px 8px var(--c-emerald-glow);
    }
    #tabSta.active {
      background: rgba(6, 182, 212, 0.15);
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 1px 8px var(--c-cyan-glow);
    }
    #tabBle.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 1px 8px var(--c-azure-glow);
    }
    #tabSpp.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 1px 8px var(--c-amber-glow);
    }

    .transport-tab-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: all 0.15s ease;
    }
    #tabSoftap.active .transport-tab-dot {
      background: var(--c-emerald);
      box-shadow: 0 0 6px var(--c-emerald);
    }
    #tabSta.active .transport-tab-dot {
      background: var(--c-cyan);
      box-shadow: 0 0 6px var(--c-cyan);
    }
    #tabBle.active .transport-tab-dot {
      background: var(--c-azure);
      box-shadow: 0 0 6px var(--c-azure);
    }
    #tabSpp.active .transport-tab-dot {
      background: var(--c-amber);
      box-shadow: 0 0 6px var(--c-amber);
    }

    .conn-sub-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: color 0.12s ease;
    }
    .conn-sub-badge:hover {
      color: var(--text-main);
    }
    .conn-sub-badge::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--c-emerald);
      box-shadow: 0 0 4px var(--c-emerald);
    }
    .conn-sub-badge .conn-gear {
      font-size: 9px;
      opacity: 0.7;
    }

    /* RIGHT UPPER END: CONTROL CLUSTER */
    .top-right-control-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bj-custom-button {
      height: 52px;
      width: 52px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 50%;
      box-shadow: var(--shadow-key);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
      padding: 4px;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .bj-custom-button:hover {
      border-color: var(--c-white);
      background: var(--bg-key-hover);
    }
    .bj-custom-button:active {
      transform: translateY(1px);
      box-shadow: var(--shadow-key-pressed);
      background: var(--bg-pressed);
    }
    .bj-custom-button.active-joy {
      border-color: var(--c-amber);
      background: rgba(245, 158, 11, 0.08);
      box-shadow: 0 0 10px var(--c-amber-glow);
    }
    .bj-custom-button.disabled {
      opacity: 0.22;
      pointer-events: none;
    }

    .bj-glyph-icon {
      font-size: 15px;
      line-height: 1;
      color: var(--c-burgundy);
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .bj-custom-button.active-joy .bj-glyph-icon {
      color: var(--c-amber);
      transform: scale(1.1);
      filter: drop-shadow(0 0 4px var(--c-amber-glow));
    }

    .bj-label-text {
      font-family: var(--font-sans);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--text-main);
      line-height: 1;
    }
    .bj-custom-button.active-joy .bj-label-text {
      color: #FDE68A;
    }

    /* RIGHT COLUMN: VERTICALLY STACKED SWITCHES (RC/LFR and 4v4/2WD) */
    .top-right-mode-column {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    /* Generous Click/Touch Vicinity Target Wrapper */
    .switch-touch-zone {
      padding: 1px 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-radius: var(--radius-xs);
      transition: background-color 0.1s ease;
    }
    .switch-touch-zone:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .switch-touch-zone:active {
      background: var(--c-burgundy-subtle);
    }

    .segmented-switch {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      display: inline-flex;
      padding: 2px;
      position: relative;
      cursor: pointer;
      width: 120px;
    }
    .segmented-switch.disabled {
      opacity: 0.22;
      pointer-events: none;
    }

    .switch-pill {
      flex: 1;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 3px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .switch-pill:hover {
      color: var(--text-main);
    }
    .switch-pill.active {
      background: var(--c-burgundy);
      color: var(--c-white);
      box-shadow: 0 1px 4px var(--c-burgundy-glow);
    }
    
    /* Distinct Autonomous Identity for LFR */
    #pillLFR.active {
      background: linear-gradient(135deg, #7C3AED, #5B21B6);
      color: #FFFFFF;
      box-shadow: 0 1px 6px rgba(124, 58, 237, 0.45);
    }

    /* Centered Numerical Value Badge (Adjusted cleanly above slider, no headings!) */
    .throttle-value-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      padding: 2px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      margin-bottom: 7px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.1s ease;
      letter-spacing: 0.5px;
    }

    /* =========================================================================
       SLENDER THROTTLE SLIDER (VERTICAL)
       ========================================================================= */
    .throttle-zone-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
      width: 90px;
    }

    .slim-vertical-track {
      position: relative;
      width: 26px;
      height: 270px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 13px;
      box-shadow: var(--shadow-rail);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }

    .slim-vertical-fill {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      background: linear-gradient(to top, var(--c-burgundy) 0%, #BE123C 60%, var(--c-flame) 100%);
      border-radius: 9px;
      pointer-events: none;
      transition: height 0.04s ease-out;
      box-shadow: 0 0 10px rgba(255, 45, 85, 0.35);
    }

    .slim-slider-thumb-v {
      position: absolute;
      width: 58px;
      height: 38px;
      background: var(--bg-key);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      box-shadow: var(--shadow-key);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      z-index: 2;
      transition: border-color 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
    }
    .slim-slider-thumb-v:hover {
      border-color: var(--c-white);
      box-shadow: var(--shadow-key), 0 0 8px rgba(255, 255, 255, 0.1);
    }
    .slim-slider-thumb-v:active, .slim-slider-thumb-v.dragging {
      cursor: grabbing;
      background: var(--bg-pressed);
      border-color: var(--c-flame);
      box-shadow: var(--shadow-key-pressed), 0 0 12px var(--c-flame-glow);
    }
    .knob-accent-bar-v {
      width: 20px;
      height: 2.5px;
      background: var(--c-flame);
      border-radius: 1px;
      box-shadow: 0 0 5px var(--c-flame-glow);
    }

    /* =========================================================================
       SLENDER STEERING SLIDER (HORIZONTAL)
       ========================================================================= */
    .steering-zone-horizontal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 280px;
    }

    .slim-horizontal-track {
      position: relative;
      width: 270px;
      height: 26px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 13px;
      box-shadow: var(--shadow-rail);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }

    .track-datum-v {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border-medium);
      pointer-events: none;
    }

    .track-datum-h {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border-medium);
      pointer-events: none;
    }

    .slim-slider-thumb-h {
      position: absolute;
      width: 38px;
      height: 58px;
      background: var(--bg-key);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      box-shadow: var(--shadow-key);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      z-index: 2;
      transition: border-color 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
    }
    .slim-slider-thumb-h:hover {
      border-color: var(--c-white);
      box-shadow: var(--shadow-key), 0 0 8px rgba(255, 255, 255, 0.1);
    }
    .slim-slider-thumb-h:active, .slim-slider-thumb-h.dragging {
      cursor: grabbing;
      background: var(--bg-pressed);
      border-color: var(--c-cyan);
      box-shadow: var(--shadow-key-pressed), 0 0 12px var(--c-cyan-glow);
    }
    .knob-accent-bar-h {
      width: 2.5px;
      height: 20px;
      background: var(--c-cyan);
      border-radius: 1px;
      box-shadow: 0 0 5px var(--c-cyan-glow);
    }

    /* CENTER NEGATIVE SPACE */
    .center-open-space {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* RIGHT THUMB: 4-MOVEMENT DIAMOND KEYPAD */
    .diamond-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 240px;
    }

    .keys-diamond-pad {
      position: relative;
      width: 230px;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-key {
      position: absolute;
      width: 72px;
      height: 72px;
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: var(--shadow-key);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: transform 0.06s ease, box-shadow 0.06s ease, background-color 0.06s ease, border-color 0.06s ease;
    }
    .ctrl-key:hover {
      border-color: var(--border-medium);
      background: var(--bg-key-hover);
    }

    .key-up    { top: 0px; left: calc(50% - 36px); }
    .key-down  { bottom: 0px; left: calc(50% - 36px); }
    .key-left  { left: 0px; top: calc(50% - 36px); }
    .key-right { right: 0px; top: calc(50% - 36px); }

    .ctrl-key svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-main);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: filter 0.1s ease, stroke 0.1s ease;
    }

    .ctrl-key:active, .ctrl-key.pressed {
      transform: translateY(2px);
      box-shadow: var(--shadow-key-pressed), 0 0 14px var(--c-burgundy-glow);
      background: linear-gradient(135deg, var(--c-burgundy), #8E0E2E);
      border-color: #BE123C;
    }
    .ctrl-key:active svg, .ctrl-key.pressed svg {
      stroke: #FFFFFF;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
    }

    /* =========================================================================
       VIEW: ANALOG JOYSTICK
       ========================================================================= */
    .joy-clean-layout {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 20px;
    }

    .joy-gimbal-ring {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: 
        radial-gradient(circle, rgba(109, 0, 26, 0.08) 0%, rgba(109, 0, 26, 0.03) 45%, transparent 75%),
        var(--bg-card);
      border: 1px solid var(--border-subtle);
      position: relative;
      touch-action: none;
      box-shadow: var(--shadow-rail), 0 0 24px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Concentric Range Rings */
    .joy-gimbal-ring::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .joy-gimbal-ring::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    .joy-stick-knob {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--bg-key);
      border: 1.5px solid var(--border-medium);
      box-shadow: var(--shadow-key);
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .joy-stick-knob:active {
      cursor: grabbing;
      border-color: var(--c-flame);
      box-shadow: var(--shadow-key-pressed), 0 0 12px var(--c-flame-glow);
    }
    .joy-stick-knob::after {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--c-burgundy);
      box-shadow: 0 0 8px var(--c-burgundy-glow);
      transition: all 0.15s ease;
    }
    .joy-stick-knob:active::after {
      background: var(--c-flame);
      box-shadow: 0 0 12px var(--c-flame);
    }

    .joy-data-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .joy-data-val {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }
    .joy-data-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* =========================================================================
       VIEW: LINE FOLLOWER (PID + KV CONSOLE) - STRATEGIC TELEMETRY COLORS
       ========================================================================= */
    .lfr-clean-layout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .lfr-preset-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-hairline);
    }

    #prDefault.active {
      background: var(--c-burgundy);
      color: #FFFFFF;
      border-color: var(--c-burgundy);
      box-shadow: 0 1px 6px var(--c-burgundy-glow);
    }
    #prSprint.active {
      background: linear-gradient(135deg, #E11D48, #BE123C);
      color: #FFFFFF;
      border-color: #E11D48;
      box-shadow: 0 1px 6px rgba(225, 29, 72, 0.45);
    }
    #prSharp.active {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #FFFFFF;
      border-color: #F59E0B;
      box-shadow: 0 1px 6px rgba(245, 158, 11, 0.45);
    }

    .lfr-clean-row {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      display: grid;
      grid-template-columns: 140px 1fr 140px;
      align-items: center;
      gap: 16px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .lfr-clean-row:hover {
      border-color: var(--border-medium);
      background: rgba(255, 255, 255, 0.02);
    }

    .lfr-row-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Semantic Tag Badges */
    .lfr-tag-pill {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Row 1: Speed (Emerald) */
    .lfr-row-speed .lfr-tag-pill {
      background: var(--c-emerald-subtle);
      color: var(--c-emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .lfr-row-speed .fader-slider::-webkit-slider-thumb {
      border-color: var(--c-emerald);
      box-shadow: 0 0 6px var(--c-emerald-glow);
    }
    .lfr-row-speed .number-box:focus {
      border-color: var(--c-emerald);
      box-shadow: 0 0 6px var(--c-emerald-glow);
    }

    /* Row 2: Kp (Amber) */
    .lfr-row-kp .lfr-tag-pill {
      background: var(--c-amber-subtle);
      color: var(--c-amber);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .lfr-row-kp .fader-slider::-webkit-slider-thumb {
      border-color: var(--c-amber);
      box-shadow: 0 0 6px var(--c-amber-glow);
    }
    .lfr-row-kp .number-box:focus {
      border-color: var(--c-amber);
      box-shadow: 0 0 6px var(--c-amber-glow);
    }

    /* Row 3: Ki (Amethyst) */
    .lfr-row-ki .lfr-tag-pill {
      background: var(--c-amethyst-subtle);
      color: var(--c-amethyst);
      border: 1px solid rgba(139, 92, 246, 0.35);
    }
    .lfr-row-ki .fader-slider::-webkit-slider-thumb {
      border-color: var(--c-amethyst);
      box-shadow: 0 0 6px var(--c-amethyst-glow);
    }
    .lfr-row-ki .number-box:focus {
      border-color: var(--c-amethyst);
      box-shadow: 0 0 6px var(--c-amethyst-glow);
    }

    /* Row 4: Kd (Cyan) */
    .lfr-row-kd .lfr-tag-pill {
      background: var(--c-cyan-subtle);
      color: var(--c-cyan);
      border: 1px solid rgba(6, 182, 212, 0.35);
    }
    .lfr-row-kd .fader-slider::-webkit-slider-thumb {
      border-color: var(--c-cyan);
      box-shadow: 0 0 6px var(--c-cyan-glow);
    }
    .lfr-row-kd .number-box:focus {
      border-color: var(--c-cyan);
      box-shadow: 0 0 6px var(--c-cyan-glow);
    }

    /* Row 5: Kv (Rose) */
    .lfr-row-kv .lfr-tag-pill {
      background: var(--c-rose-subtle);
      color: var(--c-rose);
      border: 1px solid rgba(244, 63, 94, 0.35);
    }
    .lfr-row-kv .fader-slider::-webkit-slider-thumb {
      border-color: var(--c-rose);
      box-shadow: 0 0 6px var(--c-rose-glow);
    }
    .lfr-row-kv .number-box:focus {
      border-color: var(--c-rose);
      box-shadow: 0 0 6px var(--c-rose-glow);
    }

    .fader-slider {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--bg-pressed);
      outline: none;
      cursor: pointer;
    }
    .fader-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--c-white);
      border: 2px solid var(--c-burgundy);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .fader-slider::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }

    .stepper-box {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
    }
    .stepper-btn {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-xs);
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.1s ease, border-color 0.1s ease;
    }
    .stepper-btn:hover {
      background: var(--bg-pressed);
      border-color: var(--border-medium);
    }
    .stepper-btn:active {
      transform: scale(0.96);
    }
    .number-box {
      width: 64px;
      height: 26px;
      background: var(--bg-key);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xs);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      padding: 0 6px;
      outline: none;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .number-box:focus {
      border-color: var(--c-burgundy);
    }

    /* =========================================================================
       3. SLENDER FOOTER STATUS
       ========================================================================= */
    .app-footer {
      height: 32px;
      background: var(--bg-frame);
      border-top: 1px solid var(--border-hairline);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .tag-mini {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 1px 7px;
      border-radius: var(--radius-xs);
      font-family: var(--font-mono);
      color: var(--text-main);
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    .tag-mini.burgundy {
      background: var(--c-burgundy);
      border-color: var(--c-burgundy);
      color: #FFFFFF;
    }

    /* Dynamic Telemetry Token Semantic Coloring */
    .tag-mini.token-stop {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.5);
      color: #FCA5A5;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.25);
    }
    .tag-mini.token-motion {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.5);
      color: #6EE7B7;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.25);
    }
    .tag-mini.token-speed {
      background: rgba(190, 18, 60, 0.22);
      border-color: rgba(255, 45, 85, 0.5);
      color: #FDA4AF;
      box-shadow: 0 0 8px rgba(255, 45, 85, 0.25);
    }
    .tag-mini.token-tune {
      background: rgba(139, 92, 246, 0.16);
      border-color: rgba(139, 92, 246, 0.5);
      color: #C4B5FD;
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.25);
    }
    .tag-mini.token-conn {
      background: rgba(59, 130, 246, 0.16);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93C5FD;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.25);
    }

    /* Wireless Drawer Sheet */
    .drawer-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .drawer-scrim.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-sheet {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 300px;
      background: var(--bg-frame);
      border-left: 1px solid var(--border-subtle);
      box-shadow: -6px 0 24px rgba(0, 0, 0, 0.7);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    .drawer-sheet.active {
      transform: translateX(0);
    }
  </style>
</head>
<body class="theme-dark">

  <!-- Desktop Testing / Preview Toolbar -->
  <aside class="toolbar-quick">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-weight: 800; letter-spacing: 0.6px; color: var(--text-main);">ShiftCtrlHub</span>
      <span>•</span>
      <span>Modern Minimalist Remote</span>
    </div>

    <div style="display: flex; align-items: center; gap: 6px;">
      <button onclick="toggleTheme()" id="btnThemeToggle" class="quick-btn">
        <span id="themeDot" style="width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF;"></span>
        <span id="themeText">Dark</span>
      </button>

      <button onclick="toggleFullscreen()" class="quick-btn">
        <span>⛶</span> Fullscreen
      </button>
    </div>
  </aside>

  <!-- =========================================================================
       LANDSCAPE DEVICE CHASSIS
       ========================================================================= -->
  <div id="deviceChassis" class="device-chassis">

    <!-- 1. SLIM TOP BAR WITH VERTICALLY STACKED SWITCHES IN UPPER RIGHT -->
    <header class="app-header">
      
      <!-- Left: Wordmark -->
      <div class="header-left-group">
        <div class="brand-mark" onclick="openDrawer()" style="cursor: pointer;" title="Open Wireless Settings">
          <div class="brand-dot"></div>
          <span>ShiftCtrlHub</span>
        </div>
      </div>

      <!-- CENTER OF RIBBON: 4 WAYS TO CONNECT (SoftAP, STA, BLE, SPP) -->
      <div class="header-center-connections">
        <div class="transport-bar" id="transportBar">
          <button class="transport-tab active" id="tabSoftap" onclick="setConnectionTransport('softap')" title="Wi-Fi Direct SoftAP (192.168.4.1)">
            <span class="transport-tab-dot"></span>
            <span class="transport-tab-name">SoftAP</span>
          </button>
          <button class="transport-tab" id="tabSta" onclick="setConnectionTransport('sta')" title="Wi-Fi Station Mode (Router UDP)">
            <span class="transport-tab-dot"></span>
            <span class="transport-tab-name">STA</span>
          </button>
          <button class="transport-tab" id="tabBle" onclick="setConnectionTransport('ble')" title="Bluetooth Low Energy (BLE UART)">
            <span class="transport-tab-dot"></span>
            <span class="transport-tab-name">BLE</span>
          </button>
          <button class="transport-tab" id="tabSpp" onclick="setConnectionTransport('spp')" title="Bluetooth Classic SPP (HC-05 / RPi)">
            <span class="transport-tab-dot"></span>
            <span class="transport-tab-name">SPP</span>
          </button>
        </div>
        <div class="conn-sub-badge" onclick="openDrawer()" title="Click to edit IP, Port, or Bluetooth settings">
          <span id="activeConnDetail" class="tnum">192.168.4.1:3333</span>
          <span class="conn-gear">⚙</span>
        </div>
      </div>

      <!-- RIGHT UPPER END: CONTROL CLUSTER (BUTTONS/JOY ON LEFT, RC/LFR & 4v4/2WD ON RIGHT) -->
      <div class="top-right-control-cluster">
        
        <!-- BUTTONS / JOYSTICK BUTTON: IMMEDIATE LEFT OF THE SWITCHES -->
        <div class="switch-touch-zone" onclick="toggleButtonsJoystick()" title="Click to toggle Buttons / Joystick">
          <button id="btnBjToggle" class="bj-custom-button" type="button">
            <span id="bjGlyph" class="bj-glyph-icon">✛</span>
            <span id="bjTitle" class="bj-label-text">BUTTONS</span>
          </button>
        </div>

        <!-- VERTICALLY STACKED SWITCHES (ONE LINE VERTICALLY - KODULAR STYLE) -->
        <div class="top-right-mode-column">
          <!-- Switch 1: RC vs LFR -->
          <div class="switch-touch-zone" onclick="handleRcLfrClick(event)" title="Click anywhere near to toggle RC / LFR">
            <div class="segmented-switch" id="rcLfrSwitch">
              <div id="pillRC" class="switch-pill active">RC</div>
              <div id="pillLFR" class="switch-pill">LFR</div>
            </div>
          </div>

          <!-- Switch 2: 4v4 vs 2WD -->
          <div class="switch-touch-zone" onclick="handleDriveClick(event)" title="Click anywhere near to toggle 4v4 / 2WD">
            <div class="segmented-switch" id="driveSwitch">
              <div id="pill4v4" class="switch-pill active">4v4</div>
              <div id="pill2WD" class="switch-pill">2WD</div>
            </div>
          </div>
        </div>

      </div>

    </header>

    <!-- 2. COCKPIT CANVAS -->
    <main class="cockpit-canvas">

      <!-- =====================================================================
           MODE 1: 4WD ROVER (BUTTONS MODE)
           - Left: Vertical Throttle Slider (0–255) with Centered Numerical Value (No Heading)
           - Center: Clean Open Negative Space
           - Right: 4-Movement Diamond
           ===================================================================== -->
      <section id="view4wdButtons" class="cockpit-surface active">
        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between;">
          
          <!-- LEFT: SLENDER VERTICAL THROTTLE (NUMERICAL VALUE POSITIONED CLEANLY ABOVE SLIDER) -->
          <div class="throttle-zone-vertical">
            <div class="throttle-value-badge tnum" id="speedNum4wd">180</div>

            <div id="throttleTrack4wd" class="slim-vertical-track">
              <div id="throttleFill4wd" class="slim-vertical-fill"></div>
              <div id="throttleKnob4wd" class="slim-slider-thumb-v">
                <div class="knob-accent-bar-v"></div>
              </div>
            </div>
          </div>

          <!-- CENTER: CLEAN OPEN SPACE -->
          <div class="center-open-space"></div>

          <!-- RIGHT: 4-MOVEMENT DIAMOND -->
          <div class="diamond-zone">
            <div class="keys-diamond-pad">
              <button id="btnFwd" class="ctrl-key key-up"
                      onpointerdown="onMotionDown('C:F', event)" onpointerup="onMotionUp(event)" onpointercancel="onMotionUp(event)">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
              <button id="btnRev" class="ctrl-key key-down"
                      onpointerdown="onMotionDown('C:B', event)" onpointerup="onMotionUp(event)" onpointercancel="onMotionUp(event)">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
              </button>
              <button id="btnLeft" class="ctrl-key key-left"
                      onpointerdown="onMotionDown('C:L', event)" onpointerup="onMotionUp(event)" onpointercancel="onMotionUp(event)">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              </button>
              <button id="btnRight" class="ctrl-key key-right"
                      onpointerdown="onMotionDown('C:R', event)" onpointerup="onMotionUp(event)" onpointercancel="onMotionUp(event)">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>

        </div>
      </section>

      <!-- =====================================================================
           MODE 2: 2WD TANK DRIVE (SLIDERS MODE)
           - Left: Vertical Throttle Slider (auto-centers to 0%) with Centered Value
           - Center: Clean Open Negative Space
           - Right: Horizontal Steering Slider (auto-centers to 0%) with Centered Value
           ===================================================================== -->
      <section id="view2wdSliders" class="cockpit-surface">
        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
          
          <!-- LEFT: VERTICAL THROTTLE SLIDER (AUTO-CENTERS TO 0) -->
          <div class="throttle-zone-vertical">
            <div class="throttle-value-badge tnum" id="readout2wdThrottle">0%</div>

            <div id="track2wdThrottle" class="slim-vertical-track">
              <div class="track-datum-h"></div>
              <div id="knob2wdThrottle" class="slim-slider-thumb-v" style="top: calc(50% - 19px);">
                <div class="knob-accent-bar-v"></div>
              </div>
            </div>
          </div>

          <!-- CENTER: CLEAN OPEN SPACE -->
          <div class="center-open-space"></div>

          <!-- RIGHT: HORIZONTAL STEERING SLIDER (AUTO-CENTERS TO 0) -->
          <div class="steering-zone-horizontal">
            <div class="throttle-value-badge tnum" id="readout2wdSteering">0%</div>

            <div id="track2wdSteering" class="slim-horizontal-track">
              <div class="track-datum-v"></div>
              <div id="knob2wdSteering" class="slim-slider-thumb-h" style="left: calc(50% - 19px);">
                <div class="knob-accent-bar-h"></div>
              </div>
            </div>
          </div>

        </div>
      </section>

      <!-- =====================================================================
           MODE 3: ANALOG JOYSTICK (WORKS IN BOTH 4v4 AND 2WD VIA B_J_SWITCH!)
           ===================================================================== -->
      <section id="viewJoystick" class="cockpit-surface">
        <div class="joy-clean-layout">
          
          <div id="joyGimbal" class="joy-gimbal-ring">
            <div id="joyStickHead" class="joy-stick-knob" style="left: calc(50% - 30px); top: calc(50% - 30px);"></div>
          </div>

          <div class="joy-data-block">
            <div id="joyMagText" class="joy-data-val tnum">0%</div>
            <div id="joyAngleText" class="joy-data-sub tnum">0°</div>
            <div id="joyDriveTag" class="tag-mini burgundy" style="margin-top: 4px;">4v4 DRIVE</div>
          </div>

          <div style="width: 140px; display: flex; flex-direction: column; align-items: center;">
            <div class="throttle-value-badge tnum" id="dbVal" style="margin-bottom: 6px;">10%</div>
            <input type="range" min="3" max="25" value="10" class="fader-slider" id="joyDeadband" oninput="document.getElementById('dbVal').textContent = this.value + '%'">
          </div>

        </div>
      </section>

      <!-- =====================================================================
           MODE 4: LINE FOLLOWER ROBOT (LFR PID + KV TUNING)
           ===================================================================== -->
      <section id="viewLFR" class="cockpit-surface">
        <div class="lfr-clean-layout">
          
          <!-- Presets Bar -->
          <div class="lfr-preset-bar">
            <div style="display: flex; gap: 6px;">
              <button onclick="applyPreset('default')" class="quick-btn" id="prDefault">Default</button>
              <button onclick="applyPreset('sprint')" class="quick-btn" id="prSprint">High Speed</button>
              <button onclick="applyPreset('sharp')" class="quick-btn" id="prSharp">Hairpin</button>
            </div>
          </div>

          <!-- Parameter: Base Speed -->
          <div class="lfr-clean-row lfr-row-speed">
            <span class="lfr-row-name">Base Speed <span class="lfr-tag-pill">PWM</span></span>
            <input type="range" id="slSpeed" min="0" max="255" value="140" class="fader-slider" oninput="syncGain('Speed', this.value, 0)">
            <div class="stepper-box">
              <button class="stepper-btn" onclick="nudgeGain('Speed', -5, 0)">−</button>
              <input type="number" id="inSpeed" value="140" min="0" max="255" step="1" class="number-box tnum" onchange="syncGain('Speed', this.value, 0)">
              <button class="stepper-btn" onclick="nudgeGain('Speed', 5, 0)">+</button>
            </div>
          </div>

          <!-- Parameter: Kp -->
          <div class="lfr-clean-row lfr-row-kp">
            <span class="lfr-row-name">Kp <span class="lfr-tag-pill">Prop</span></span>
            <input type="range" id="slKp" min="0" max="10" step="0.1" value="2.5" class="fader-slider" oninput="syncGain('Kp', this.value, 1)">
            <div class="stepper-box">
              <button class="stepper-btn" onclick="nudgeGain('Kp', -0.1, 1)">−</button>
              <input type="number" id="inKp" value="2.5" min="0" max="10" step="0.1" class="number-box tnum" onchange="syncGain('Kp', this.value, 1)">
              <button class="stepper-btn" onclick="nudgeGain('Kp', 0.1, 1)">+</button>
            </div>
          </div>

          <!-- Parameter: Ki -->
          <div class="lfr-clean-row lfr-row-ki">
            <span class="lfr-row-name">Ki <span class="lfr-tag-pill">Integ</span></span>
            <input type="range" id="slKi" min="0" max="2" step="0.01" value="0.05" class="fader-slider" oninput="syncGain('Ki', this.value, 2)">
            <div class="stepper-box">
              <button class="stepper-btn" onclick="nudgeGain('Ki', -0.01, 2)">−</button>
              <input type="number" id="inKi" value="0.05" min="0" max="2" step="0.01" class="number-box tnum" onchange="syncGain('Ki', this.value, 2)">
              <button class="stepper-btn" onclick="nudgeGain('Ki', 0.01, 2)">+</button>
            </div>
          </div>

          <!-- Parameter: Kd -->
          <div class="lfr-clean-row lfr-row-kd">
            <span class="lfr-row-name">Kd <span class="lfr-tag-pill">Deriv</span></span>
            <input type="range" id="slKd" min="0" max="10" step="0.1" value="1.8" class="fader-slider" oninput="syncGain('Kd', this.value, 1)">
            <div class="stepper-box">
              <button class="stepper-btn" onclick="nudgeGain('Kd', -0.1, 1)">−</button>
              <input type="number" id="inKd" value="1.8" min="0" max="10" step="0.1" class="number-box tnum" onchange="syncGain('Kd', this.value, 1)">
              <button class="stepper-btn" onclick="nudgeGain('Kd', 0.1, 1)">+</button>
            </div>
          </div>

          <!-- Parameter: Kv -->
          <div class="lfr-clean-row lfr-row-kv">
            <span class="lfr-row-name">Kv <span class="lfr-tag-pill">Scale</span></span>
            <input type="range" id="slKv" min="0" max="5" step="0.1" value="1.2" class="fader-slider" oninput="syncGain('Kv', this.value, 1)">
            <div class="stepper-box">
              <button class="stepper-btn" onclick="nudgeGain('Kv', -0.1, 1)">−</button>
              <input type="number" id="inKv" value="1.2" min="0" max="5" step="0.1" class="number-box tnum" onchange="syncGain('Kv', this.value, 1)">
              <button class="stepper-btn" onclick="nudgeGain('Kv', 0.1, 1)">+</button>
            </div>
          </div>

        </div>
      </section>

    </main>

    <!-- 3. SLENDER FOOTER STATUS -->
    <footer class="app-footer">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="lastTxToken" class="tag-mini burgundy">C:S</span>
        <span id="footerSpeedVal" class="tag-mini">180</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="activeModeStatus" style="font-size: 10px; letter-spacing: 0.5px;">RC // 4v4</span>
        <span style="color: var(--border-medium);">|</span>
        <span id="protocolStatus" class="tnum" style="font-size: 10px;">UDP 3333</span>
      </div>
    </footer>

    <!-- Wireless Connection Drawer -->
    <div id="drawerScrim" class="drawer-scrim" onclick="closeDrawer()"></div>
    <aside id="drawerSheet" class="drawer-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle); font-weight: 700; font-size: 12px; text-transform: uppercase;">
        <span>Wireless</span>
        <button onclick="closeDrawer()" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;">✕</button>
      </div>

      <div>
        <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">Interface</div>
        <select id="transportSelect" style="height: 32px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xs); color: var(--text-main); padding: 0 8px; font-family: var(--font-mono); font-size: 11px; width: 100%;">
          <option value="softap">Wi-Fi (SoftAP - 192.168.4.1)</option>
          <option value="sta">Wi-Fi (STA - Router)</option>
          <option value="ble">Bluetooth Low Energy (BLE)</option>
          <option value="spp">Bluetooth Classic SPP</option>
        </select>
      </div>

      <div style="margin-top: 8px;">
        <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;">IP Address</div>
        <input type="text" id="cfgIp" value="192.168.4.1" style="height: 32px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xs); color: var(--text-main); padding: 0 8px; font-family: var(--font-mono); font-size: 11px; width: 100%;">
      </div>

      <button onclick="saveWirelessSettings()" class="quick-btn" style="background: var(--c-burgundy); color: var(--c-white); font-weight: 700; height: 34px; justify-content: center; margin-top: auto; border: none;">
        Save
      </button>
    </aside>

  </div>

  <!-- =========================================================================
       JAVASCRIPT CONTROLLER LOGIC
       ========================================================================= -->
  <script>
    let currentRcLfr = 'RC';       // 'RC' or 'LFR'
    let currentDrive = '4v4';      // '4v4' or '2WD'
    let currentBJ = 'Buttons';     // 'Buttons' or 'Joystick' (WORKS IN BOTH 4v4 & 2WD!)
    let currentSpeed = 180;        // 0 to 255
    let isMoving = false;
    let activeCmd = 'C:S';

    // 1. Vicinity click handlers for Top-Right Switches (Kodular layout style)
    function handleRcLfrClick(e) {
      if (e.target.id === 'pillRC') {
        setRcLfr('RC');
      } else if (e.target.id === 'pillLFR') {
        setRcLfr('LFR');
      } else {
        // Clicked in vicinity / margin / border: toggle to opposite state
        setRcLfr(currentRcLfr === 'RC' ? 'LFR' : 'RC');
      }
    }

    function handleDriveClick(e) {
      if (currentRcLfr === 'LFR') return;
      if (e.target.id === 'pill4v4') {
        setDriveMode('4v4');
      } else if (e.target.id === 'pill2WD') {
        setDriveMode('2WD');
      } else {
        // Clicked in vicinity / margin / border: toggle to opposite state
        setDriveMode(currentDrive === '4v4' ? '2WD' : '4v4');
      }
    }

    let currentTransport = 'softap';

    function setConnectionTransport(type) {
      currentTransport = type;
      ['softap', 'sta', 'ble', 'spp'].forEach(t => {
        const el = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (el) el.classList.toggle('active', t === type);
      });

      const infoEl = document.getElementById('activeConnDetail');
      const protoEl = document.getElementById('protocolStatus');
      const select = document.getElementById('transportSelect');
      if (select) select.value = type;

      if (type === 'softap') {
        if (infoEl) infoEl.textContent = '192.168.4.1:3333';
        if (protoEl) protoEl.textContent = 'WIFI SOFTAP 3333';
      } else if (type === 'sta') {
        const ip = document.getElementById('cfgIp') ? document.getElementById('cfgIp').value : '192.168.1.105';
        if (infoEl) infoEl.textContent = `${ip}:3333`;
        if (protoEl) protoEl.textContent = 'WIFI STA (UDP)';
      } else if (type === 'ble') {
        if (infoEl) infoEl.textContent = 'ShiftCtrlHub (BLE)';
        if (protoEl) protoEl.textContent = 'BLE UART';
      } else if (type === 'spp') {
        if (infoEl) infoEl.textContent = 'ShiftCtrlHub (SPP)';
        if (protoEl) protoEl.textContent = 'BT SPP RFCOMM';
      }
      dispatchCommand(`CONN:${type.toUpperCase()}`);
    }

    function toggleButtonsJoystick() {
      if (currentRcLfr === 'LFR') return;
      setButtonsJoystick(currentBJ === 'Buttons' ? 'Joystick' : 'Buttons');
    }

    function setButtonsJoystick(mode) {
      currentBJ = mode;
      const btn = document.getElementById('btnBjToggle');
      const glyph = document.getElementById('bjGlyph');
      const title = document.getElementById('bjTitle');

      if (btn && glyph && title) {
        if (mode === 'Buttons') {
          btn.classList.remove('active-joy');
          glyph.textContent = '✛';
          title.textContent = 'BUTTONS';
        } else {
          btn.classList.add('active-joy');
          glyph.textContent = '🕹';
          title.textContent = 'JOYSTICK';
        }
      }
      evaluateActiveCockpit();
    }

    function setRcLfr(mode) {
      currentRcLfr = mode;
      const pillRC = document.getElementById('pillRC');
      const pillLFR = document.getElementById('pillLFR');
      const driveSwitch = document.getElementById('driveSwitch');
      const btnBjToggle = document.getElementById('btnBjToggle');

      if (mode === 'RC') {
        pillRC.classList.add('active');
        pillLFR.classList.remove('active');
        driveSwitch.classList.remove('disabled');
        if (btnBjToggle) btnBjToggle.classList.remove('disabled');
      } else {
        pillLFR.classList.add('active');
        pillRC.classList.remove('active');
        driveSwitch.classList.add('disabled');
        if (btnBjToggle) btnBjToggle.classList.add('disabled');
      }
      evaluateActiveCockpit();
      dispatchCommand(`MODE:${mode}`);
    }

    function setDriveMode(drive) {
      currentDrive = drive;
      const pill4v4 = document.getElementById('pill4v4');
      const pill2WD = document.getElementById('pill2WD');

      if (drive === '4v4') {
        pill4v4.classList.add('active');
        pill2WD.classList.remove('active');
      } else {
        pill2WD.classList.add('active');
        pill4v4.classList.remove('active');
      }
      evaluateActiveCockpit();
      dispatchCommand(`DRIVE:${drive.toUpperCase()}`);
    }

    // 2. Evaluate and display the correct view based on Kodular logic
    function evaluateActiveCockpit() {
      document.querySelectorAll('.cockpit-surface').forEach(v => v.classList.remove('active'));
      const statusTag = document.getElementById('activeModeStatus');
      const joyDriveTag = document.getElementById('joyDriveTag');

      if (currentRcLfr === 'LFR') {
        document.getElementById('viewLFR').classList.add('active');
        statusTag.textContent = 'LFR // PID';
      } else if (currentDrive === '2WD') {
        if (currentBJ === 'Buttons') {
          // 2WD Dual Sliders (Throttle vertical + Steering horizontal)
          document.getElementById('view2wdSliders').classList.add('active');
          statusTag.textContent = 'RC // 2WD SLIDERS';
        } else {
          // 2WD with Joystick!
          document.getElementById('viewJoystick').classList.add('active');
          statusTag.textContent = 'RC // 2WD JOYSTICK';
          joyDriveTag.textContent = '2WD DIFF DRIVE';
        }
      } else {
        // 4v4 mode
        if (currentBJ === 'Buttons') {
          document.getElementById('view4wdButtons').classList.add('active');
          statusTag.textContent = 'RC // 4v4 BUTTONS';
        } else {
          // 4v4 with Joystick
          document.getElementById('viewJoystick').classList.add('active');
          statusTag.textContent = 'RC // 4v4 JOYSTICK';
          joyDriveTag.textContent = '4v4 DRIVE';
        }
      }
    }

    function dispatchCommand(token) {
      const el = document.getElementById('lastTxToken');
      if (el) {
        el.textContent = token;
        el.className = 'tag-mini';
        if (token === 'C:S') {
          el.classList.add('token-stop');
        } else if (token.startsWith('C:')) {
          el.classList.add('token-motion');
        } else if (token.startsWith('S:')) {
          el.classList.add('token-speed');
        } else if (token.startsWith('V:')) {
          el.classList.add('token-tune');
        } else if (token.startsWith('CONN:')) {
          el.classList.add('token-conn');
        } else {
          el.classList.add('burgundy');
        }
      }
      
      // Haptic feedback (if supported by device)
      try {
        if (navigator.vibrate) navigator.vibrate(15);
      } catch (e) {}

      // Asynchronous UDP Datagram Transmission
      transmitUdpToken(token);
    }

    function transmitUdpToken(token) {
      if (!token) return;
      const ip = document.getElementById('cfgIp') ? document.getElementById('cfgIp').value : '192.168.4.1';
      const port = document.getElementById('cfgPort') ? document.getElementById('cfgPort').value : 3333;

      // Send to local UDP relay bridge (relative if on port 8080, or via host:8765)
      const host = window.location.hostname || 'localhost';
      const bridgeUrl = (window.location.protocol.startsWith('http') && window.location.port === '8080')
        ? '/tx'
        : `http://${host}:8765/tx`;

      try {
        fetch(bridgeUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, ip: ip, port: port }),
          mode: 'cors'
        }).catch(function() {
          // Quietly ignore if offline or bridge not launched
        });
      } catch (err) {}
    }

    /* -------------------------------------------------------------------------
       3. 4WD THROTTLE SLIDER (0-255)
       ------------------------------------------------------------------------- */
    const throttleTrack4wd = document.getElementById('throttleTrack4wd');
    const throttleKnob4wd = document.getElementById('throttleKnob4wd');
    const throttleFill4wd = document.getElementById('throttleFill4wd');
    const speedNum4wd = document.getElementById('speedNum4wd');
    const footerSpeedVal = document.getElementById('footerSpeedVal');

    let is4wdThrottleDragging = false;
    let throttle4wdPointerId = null;

    function update4wdThrottleVisual(val) {
      currentSpeed = Math.round(val);
      footerSpeedVal.textContent = currentSpeed;
      speedNum4wd.textContent = currentSpeed;

      const trackHeight = throttleTrack4wd.clientHeight || 270;
      const knobHeight = 38;
      const availableTravel = trackHeight - knobHeight - 8;

      const ratio = currentSpeed / 255;
      const topOffset = 4 + (availableTravel * (1 - ratio));

      throttleKnob4wd.style.top = `${topOffset}px`;
      throttleFill4wd.style.height = `${availableTravel * ratio}px`;

      // Dynamic color polish on speed number badge based on intensity
      if (currentSpeed > 200) {
        speedNum4wd.style.borderColor = 'rgba(255, 45, 85, 0.6)';
        speedNum4wd.style.color = '#FF2D55';
        speedNum4wd.style.boxShadow = '0 0 10px rgba(255, 45, 85, 0.35)';
      } else if (currentSpeed > 120) {
        speedNum4wd.style.borderColor = 'rgba(245, 158, 11, 0.5)';
        speedNum4wd.style.color = '#F59E0B';
        speedNum4wd.style.boxShadow = '0 0 8px rgba(245, 158, 11, 0.25)';
      } else {
        speedNum4wd.style.borderColor = 'var(--border-subtle)';
        speedNum4wd.style.color = 'var(--text-main)';
        speedNum4wd.style.boxShadow = 'var(--shadow-sm)';
      }
    }

    function handle4wdThrottlePointerMove(clientY) {
      const rect = throttleTrack4wd.getBoundingClientRect();
      const knobHeight = 38;
      const availableTravel = rect.height - knobHeight - 8;
      
      let relativeY = clientY - rect.top - 4 - (knobHeight / 2);
      relativeY = Math.max(0, Math.min(availableTravel, relativeY));

      const ratio = 1 - (relativeY / availableTravel);
      const computedSpeed = Math.round(ratio * 255);
      if (computedSpeed === currentSpeed) return;

      update4wdThrottleVisual(computedSpeed);
      dispatchCommand(`S:${computedSpeed}`);
    }

    throttleTrack4wd.addEventListener('pointerdown', (e) => {
      is4wdThrottleDragging = true;
      throttle4wdPointerId = e.pointerId;
      throttleKnob4wd.setPointerCapture(e.pointerId);
      throttleKnob4wd.classList.add('dragging');
      handle4wdThrottlePointerMove(e.clientY);
    });

    throttleKnob4wd.addEventListener('pointerdown', (e) => {
      is4wdThrottleDragging = true;
      throttle4wdPointerId = e.pointerId;
      throttleKnob4wd.setPointerCapture(e.pointerId);
      throttleKnob4wd.classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
      if (is4wdThrottleDragging && e.pointerId === throttle4wdPointerId) {
        handle4wdThrottlePointerMove(e.clientY);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (is4wdThrottleDragging && e.pointerId === throttle4wdPointerId) {
        is4wdThrottleDragging = false;
        throttleKnob4wd.classList.remove('dragging');
      }
    });

    window.addEventListener('pointercancel', (e) => {
      if (is4wdThrottleDragging && e.pointerId === throttle4wdPointerId) {
        is4wdThrottleDragging = false;
        throttleKnob4wd.classList.remove('dragging');
      }
    });

    /* -------------------------------------------------------------------------
       4. 4WD RIGHT-THUMB 4-MOVEMENT DIAMOND BUTTONS
       ------------------------------------------------------------------------- */
    function onMotionDown(cmd, e) {
      if (e) {
        e.currentTarget.classList.add('pressed');
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}
      }
      isMoving = true;
      activeCmd = cmd;
      dispatchCommand(cmd);
    }

    function onMotionUp(e) {
      if (e) {
        e.currentTarget.classList.remove('pressed');
      }
      isMoving = false;
      activeCmd = 'C:S';
      dispatchCommand('C:S');
    }

    /* -------------------------------------------------------------------------
       5. 2WD MODE SLIDERS:
          - Vertical Throttle (Auto-centers to 0%, dispatches S:FB:<val>)
          - Horizontal Steering (Auto-centers to 0%, dispatches S:RL:<val>)
       ------------------------------------------------------------------------- */
    function init2wdSliders() {
      // 5.1 Vertical Throttle Slider
      setupVerticalSpringSlider('track2wdThrottle', 'knob2wdThrottle', 'readout2wdThrottle', 'FB');

      // 5.2 Horizontal Steering Slider
      setupHorizontalSpringSlider('track2wdSteering', 'knob2wdSteering', 'readout2wdSteering', 'RL');
    }

    function setupVerticalSpringSlider(trackId, knobId, readoutId, cmdSuffix) {
      const track = document.getElementById(trackId);
      const knob = document.getElementById(knobId);
      const readout = document.getElementById(readoutId);
      let dragging = false;
      let pId = null;
      let lastPct = null;

      function onMove(clientY) {
        if (!dragging) return;
        const rect = track.getBoundingClientRect();
        const centerY = rect.top + (rect.height / 2);
        const maxTravel = (rect.height / 2) - 20;

        let deltaY = clientY - centerY;
        deltaY = Math.max(-maxTravel, Math.min(maxTravel, deltaY));

        knob.style.top = `calc(50% + ${deltaY - 19}px)`;
        const pct = Math.round((-deltaY / maxTravel) * 100);
        if (pct === lastPct) return;
        lastPct = pct;
        readout.textContent = `${pct > 0 ? '+' : ''}${pct}%`;

        // Dynamic color feedback for forward (+) vs reverse (-)
        if (pct > 0) {
          readout.style.borderColor = 'rgba(16, 185, 129, 0.5)';
          readout.style.color = '#10B981';
          readout.style.boxShadow = '0 0 10px rgba(16, 185, 129, 0.3)';
        } else if (pct < 0) {
          readout.style.borderColor = 'rgba(244, 63, 94, 0.5)';
          readout.style.color = '#F43F5E';
          readout.style.boxShadow = '0 0 10px rgba(244, 63, 94, 0.3)';
        } else {
          readout.style.borderColor = 'var(--border-subtle)';
          readout.style.color = 'var(--text-main)';
          readout.style.boxShadow = 'var(--shadow-sm)';
        }
        dispatchCommand(`S:${cmdSuffix}:${pct}`);
      }

      function onRelease() {
        if (!dragging) return;
        dragging = false;
        lastPct = null;
        knob.style.transition = 'top 0.15s ease-out';
        knob.style.top = 'calc(50% - 19px)';
        setTimeout(() => { knob.style.transition = 'none'; }, 160);
        readout.textContent = '0%';
        readout.style.borderColor = 'var(--border-subtle)';
        readout.style.color = 'var(--text-main)';
        readout.style.boxShadow = 'var(--shadow-sm)';
        dispatchCommand(`S:${cmdSuffix}:0`);
      }

      track.addEventListener('pointerdown', (e) => {
        dragging = true;
        pId = e.pointerId;
        knob.setPointerCapture(e.pointerId);
        onMove(e.clientY);
      });
      window.addEventListener('pointermove', (e) => {
        if (dragging && e.pointerId === pId) onMove(e.clientY);
      });
      window.addEventListener('pointerup', (e) => {
        if (dragging && e.pointerId === pId) onRelease();
      });
      window.addEventListener('pointercancel', (e) => {
        if (dragging && e.pointerId === pId) onRelease();
      });
    }

    function setupHorizontalSpringSlider(trackId, knobId, readoutId, cmdSuffix) {
      const track = document.getElementById(trackId);
      const knob = document.getElementById(knobId);
      const readout = document.getElementById(readoutId);
      let dragging = false;
      let pId = null;
      let lastPct = null;

      function onMove(clientX) {
        if (!dragging) return;
        const rect = track.getBoundingClientRect();
        const centerX = rect.left + (rect.width / 2);
        const maxTravel = (rect.width / 2) - 20;

        let deltaX = clientX - centerX;
        deltaX = Math.max(-maxTravel, Math.min(maxTravel, deltaX));

        knob.style.left = `calc(50% + ${deltaX - 19}px)`;
        const pct = Math.round((deltaX / maxTravel) * 100);
        if (pct === lastPct) return;
        lastPct = pct;
        readout.textContent = `${pct > 0 ? '+' : ''}${pct}%`;

        // Dynamic color feedback for steering angle
        if (pct !== 0) {
          readout.style.borderColor = 'rgba(6, 182, 212, 0.5)';
          readout.style.color = '#06B6D4';
          readout.style.boxShadow = '0 0 10px rgba(6, 182, 212, 0.3)';
        } else {
          readout.style.borderColor = 'var(--border-subtle)';
          readout.style.color = 'var(--text-main)';
          readout.style.boxShadow = 'var(--shadow-sm)';
        }
        dispatchCommand(`S:${cmdSuffix}:${pct}`);
      }

      function onRelease() {
        if (!dragging) return;
        dragging = false;
        lastPct = null;
        knob.style.transition = 'left 0.15s ease-out';
        knob.style.left = 'calc(50% - 19px)';
        setTimeout(() => { knob.style.transition = 'none'; }, 160);
        readout.textContent = '0%';
        readout.style.borderColor = 'var(--border-subtle)';
        readout.style.color = 'var(--text-main)';
        readout.style.boxShadow = 'var(--shadow-sm)';
        dispatchCommand(`S:${cmdSuffix}:0`);
      }

      track.addEventListener('pointerdown', (e) => {
        dragging = true;
        pId = e.pointerId;
        knob.setPointerCapture(e.pointerId);
        onMove(e.clientX);
      });
      window.addEventListener('pointermove', (e) => {
        if (dragging && e.pointerId === pId) onMove(e.clientX);
      });
      window.addEventListener('pointerup', (e) => {
        if (dragging && e.pointerId === pId) onRelease();
      });
      window.addEventListener('pointercancel', (e) => {
        if (dragging && e.pointerId === pId) onRelease();
      });
    }

    /* -------------------------------------------------------------------------
       6. ANALOG JOYSTICK (WORKS IN BOTH 4v4 AND 2WD)
       ------------------------------------------------------------------------- */
    function initJoystick() {
      const pad = document.getElementById('joyGimbal');
      const knob = document.getElementById('joyStickHead');
      let dragging = false;
      let pId = null;
      let lastJoyCmd = null;

      function onMove(clientX, clientY) {
        if (!dragging) return;
        const rect = pad.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const maxR = (rect.width / 2) - 32;

        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);

        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }

        knob.style.left = `calc(50% + ${dx - 30}px)`;
        knob.style.top = `calc(50% + ${dy - 30}px)`;

        const mag = Math.min(100, Math.round((dist / maxR) * 100));
        let angle = Math.round(Math.atan2(-dy, dx) * (180 / Math.PI));
        if (angle < 0) angle += 360;

        document.getElementById('joyMagText').textContent = `${mag}%`;
        document.getElementById('joyAngleText').textContent = `${angle}°`;

        const db = parseInt(document.getElementById('joyDeadband').value) || 10;
        if (mag < db) {
          if (lastJoyCmd !== 'C:S') {
            lastJoyCmd = 'C:S';
            dispatchCommand('C:S');
          }
          return;
        }

        // Exact Kodular direction algorithm from Screen1.bky:
        let cmd = 'C:S';
        if (currentDrive === '2WD') {
          // Kodular Directions_2WD: dy in screen coords (+ is down, - is up)
          if (dy > Math.abs(dx)) {
            cmd = 'C:B';
          } else if (dy < -Math.abs(dx)) {
            cmd = 'C:F';
          } else if (dy > 0 && dy < dx) {
            cmd = 'C:BR';
          } else if (dy < 0 && dy > -dx) {
            cmd = 'C:FR';
          } else if (dy > 0 && dy < -dx) {
            cmd = 'C:BL';
          } else if (dy < 0 && dy > dx) {
            cmd = 'C:FL';
          } else {
            cmd = dx > 0 ? 'C:R' : 'C:L';
          }
        } else {
          // 4v4 Differential Drive: 4 strict commands only (F, B, L, R)
          if (Math.abs(dy) >= Math.abs(dx)) {
            cmd = dy < 0 ? 'C:F' : 'C:B';
          } else {
            cmd = dx > 0 ? 'C:R' : 'C:L';
          }
        }

        if (cmd !== lastJoyCmd) {
          lastJoyCmd = cmd;
          dispatchCommand(cmd);
        }
      }

      function onRelease() {
        if (!dragging) return;
        dragging = false;
        lastJoyCmd = null;
        knob.style.transition = 'all 0.15s ease-out';
        knob.style.left = 'calc(50% - 30px)';
        knob.style.top = 'calc(50% - 30px)';
        setTimeout(() => { knob.style.transition = 'none'; }, 160);

        document.getElementById('joyMagText').textContent = '0%';
        document.getElementById('joyAngleText').textContent = '0°';
        dispatchCommand('C:S');
      }

      pad.addEventListener('pointerdown', (e) => {
        dragging = true;
        pId = e.pointerId;
        knob.setPointerCapture(e.pointerId);
        onMove(e.clientX, e.clientY);
      });
      window.addEventListener('pointermove', (e) => {
        if (dragging && e.pointerId === pId) onMove(e.clientX, e.clientY);
      });
      window.addEventListener('pointerup', (e) => {
        if (dragging && e.pointerId === pId) onRelease();
      });
      window.addEventListener('pointercancel', (e) => {
        if (dragging && e.pointerId === pId) onRelease();
      });
    }

    /* -------------------------------------------------------------------------
       7. LFR GAIN TUNING
       ------------------------------------------------------------------------- */
    function syncGain(param, val, decimals) {
      const num = parseFloat(val);
      const formatted = isNaN(num) ? 0 : num.toFixed(decimals);
      const slider = document.getElementById(`sl${param}`);
      const input = document.getElementById(`in${param}`);
      if (slider) slider.value = formatted;
      if (input) input.value = formatted;
      dispatchCommand(`V:${param}:${formatted}`);
    }

    function nudgeGain(param, step, decimals) {
      const input = document.getElementById(`in${param}`);
      const cur = parseFloat(input.value) || 0;
      const min = parseFloat(input.min);
      const max = parseFloat(input.max);
      let next = Math.max(min, Math.min(max, cur + step));
      syncGain(param, next, decimals);
    }

    function applyPreset(preset) {
      document.querySelectorAll('.quick-btn').forEach(b => {
        if (b.id && b.id.startsWith('pr')) b.classList.remove('active');
      });

      if (preset === 'default') {
        document.getElementById('prDefault').classList.add('active');
        syncGain('Speed', 140, 0);
        syncGain('Kp', 2.5, 1);
        syncGain('Ki', 0.05, 2);
        syncGain('Kd', 1.8, 1);
        syncGain('Kv', 1.2, 1);
      } else if (preset === 'sprint') {
        document.getElementById('prSprint').classList.add('active');
        syncGain('Speed', 200, 0);
        syncGain('Kp', 3.8, 1);
        syncGain('Ki', 0.02, 2);
        syncGain('Kd', 2.6, 1);
        syncGain('Kv', 1.8, 1);
      } else if (preset === 'sharp') {
        document.getElementById('prSharp').classList.add('active');
        syncGain('Speed', 110, 0);
        syncGain('Kp', 4.5, 1);
        syncGain('Ki', 0.08, 2);
        syncGain('Kd', 3.2, 1);
        syncGain('Kv', 2.4, 1);
      }
    }

    /* -------------------------------------------------------------------------
       8. THEME & FULLSCREEN
       ------------------------------------------------------------------------- */
    function toggleTheme() {
      const body = document.body;
      const isDark = body.classList.contains('theme-dark');
      const text = document.getElementById('themeText');
      const dot = document.getElementById('themeDot');

      if (isDark) {
        body.classList.remove('theme-dark');
        body.classList.add('theme-light');
        text.textContent = 'Light';
        dot.style.background = '#6D001A';
      } else {
        body.classList.remove('theme-light');
        body.classList.add('theme-dark');
        text.textContent = 'Dark';
        dot.style.background = '#FFFFFF';
      }
    }

    function toggleFullscreen() {
      const frame = document.getElementById('deviceChassis');
      frame.classList.toggle('fullscreen');
    }

    /* -------------------------------------------------------------------------
       9. WIRELESS DRAWER
       ------------------------------------------------------------------------- */
    function openDrawer() {
      document.getElementById('drawerScrim').classList.add('active');
      document.getElementById('drawerSheet').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('drawerScrim').classList.remove('active');
      document.getElementById('drawerSheet').classList.remove('active');
    }

    function saveWirelessSettings() {
      const type = document.getElementById('transportSelect').value;
      const ip = document.getElementById('cfgIp').value;
      setConnectionTransport(type);
      if (type === 'softap' || type === 'sta') {
        const detail = document.getElementById('activeConnDetail');
        if (detail) detail.textContent = `${ip}:3333`;
      }
      closeDrawer();
      dispatchCommand('CONN:SYNC');
    }

    window.addEventListener('DOMContentLoaded', () => {
      setConnectionTransport('softap');
      update4wdThrottleVisual(180);
      init2wdSliders();
      initJoystick();
      evaluateActiveCockpit();
    });
  </script>
</body>
