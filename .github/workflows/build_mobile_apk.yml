name: Build Android Beta APK

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/build_mobile_apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync root index.html into bundled mobile asset
        run: |
          mkdir -p mobile/assets/web
          cp index.html mobile/assets/web/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android wrapper & verify dependencies
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.zeeshan716 --project-name shiftctrlhub_mobile .
          rm -f test/widget_test.dart
          python3 - <<'EOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n'
          )
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", perms + "    <application", 1)
          if 'android:label="' in text:
              import re
              text = re.sub(r'android:label="[^"]+"', 'android:label="ShiftCtrlHub"', text, count=1)
          manifest.write_text(text, encoding="utf-8")

          # Skip AGP lintVitalAnalyzeRelease internal crash on webview_flutter_android
          kts = Path("android/build.gradle.kts")
          grv = Path("android/build.gradle")
          if kts.exists():
              kt = kts.read_text(encoding="utf-8")
              if "lintVital" not in kt:
                  kt += '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital", ignoreCase = true)) {\n            enabled = false\n        }\n    }\n}\n'
                  kts.write_text(kt, encoding="utf-8")
          elif grv.exists():
              gt = grv.read_text(encoding="utf-8")
              if "lintVital" not in gt:
                  gt += '\nsubprojects {\n    tasks.configureEach { t ->\n        if (t.name.toLowerCase().contains("lintvital")) {\n            t.enabled = false\n        }\n    }\n}\n'
                  grv.write_text(gt, encoding="utf-8")
          EOF
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCtrlHub-Android-Beta-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
